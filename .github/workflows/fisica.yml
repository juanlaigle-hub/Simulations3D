name: Pruebas de física
on:
  push:
  pull_request:
jobs:
  fisica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Simuladores (dron, robot, bombeo, evaporador)
        run: node --test tests/fisica.test.mjs
      - name: Reactor CSTR
        run: python -m unittest discover -s tests -v
